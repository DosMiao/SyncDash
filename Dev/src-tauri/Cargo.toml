[package]
name = "syncdash-desktop"
version = "0.9.0"
edition = "2021"
description = "SyncDash desktop shell (Tauri v2) over the syncdash core library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# custom-protocol is the "load the bundled dist" switch: without it even a release build goes to
# devUrl(localhost:5173) — which shows up as a whole-window ERR_CONNECTION_REFUSED blank page.
# `tauri build` passes it automatically; we use bare cargo build, so it has to be in default.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
export-types = []

[dependencies]
tauri = { version = "2", features = [] }
# Native directory/file picker; the frontend uses the plugin's generated TypeScript contract.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
blake3 = "1"
syncdash = { path = "../.." }
# Frontend wire contracts; generation is enabled only by the `export-types` feature.
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
