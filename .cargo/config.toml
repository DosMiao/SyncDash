# Project-level config tracked in git — keep it machine-independent. Machine-specific overrides
# (target-dir redirection and the like) go in an env var (CARGO_TARGET_DIR) or $CARGO_HOME/config.toml, never here.

# ts-rs resolves `export_to` relative to TS_RS_EXPORT_DIR, which defaults to
# `<crate manifest dir>/bindings`. This repo has two crates at different depths
# (`.` and `src-tauri`), so the default would send the two of them to different places.
#
# Pinning the base at the **workspace root** (relative = true means relative to the parent of the
# `.cargo/` directory holding this file, i.e. the repo root) makes both crates' `export_to` start
# from `<repo>/bindings`, so everything lands in `typescript/core/types/generated/`.
[env]
TS_RS_EXPORT_DIR = { value = "bindings", relative = true }
