schema_version = 2
project = "syncdash"

[[targets]]
id = "workspace-target"
label = "Workspace Cargo outputs"
path = "target"
level = "build"

[[targets]]
id = "vite-cache"
label = "Vite dependency cache"
path = "node_modules/.vite"
level = "build"

[[targets]]
id = "vite-temp-cache"
label = "Vite temporary dependency cache"
path = "node_modules/.vite-temp"
level = "build"

[[targets]]
id = "tauri-generated"
label = "Tauri generated output"
path = "Dev/src-tauri/gen"
level = "build"

[[targets]]
id = "legacy-tauri-generated"
label = "Legacy Tauri generated output"
path = "src-tauri/gen"
level = "build"

[[targets]]
id = "tauri-autogenerated-permissions"
label = "Tauri autogenerated permissions"
path = "Dev/src-tauri/permissions/autogenerated"
level = "build"

[[targets]]
id = "legacy-tauri-autogenerated-permissions"
label = "Legacy Tauri autogenerated permissions"
path = "src-tauri/permissions/autogenerated"
level = "build"

[[targets]]
id = "node-modules"
label = "Frontend dependencies"
path = "node_modules"
level = "deep"
restore = "npm-ci"
required_by = ["dev", "build:tiers-windows", "build:installer", "app-self"]

[[targets]]
id = "builder-target"
label = "Legacy project Builder Cargo outputs"
path = "tools/builder/target"
level = "build"

[[targets]]
id = "published-artifacts"
label = "Published executables and installers"
path = "."
base = "artifacts"
level = "purge"

[[preserved]]
id = "frontend-dist"
label = "Committed frontend distribution"
path = "dist"
reason = "macOS desktop builds embed this committed frontend output without requiring Node.js."

[[preserved]]
id = "reference-libraries"
label = "Manually managed reference libraries"
path = ".libs"
reason = "Reference source checkouts are not Builder outputs and have no normal-build restore contract."

[[preserved]]
id = "main-permissions"
label = "Main-window permissions"
path = "Dev/src-tauri/permissions/main.toml"
reason = "This hand-authored permission set is application source."

[[preserved]]
id = "progress-permissions"
label = "Progress-window permissions"
path = "Dev/src-tauri/permissions/progress.toml"
reason = "This hand-authored permission set is application source."

[[preserved]]
id = "tauri-capabilities"
label = "Tauri capabilities"
path = "Dev/src-tauri/capabilities"
reason = "Capability definitions are hand-authored application source."

[[preserved]]
id = "typescript-contracts"
label = "Generated TypeScript contracts"
path = "Dev/typescript/core/types/generated"
reason = "Rust-to-TypeScript contracts are committed application source and regenerated explicitly."
