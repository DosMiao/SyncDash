[package]
name = "syncdash"
version = "0.1.0"
edition = "2021"
description = "Table-driven multi-node file sync: scan -> compare -> plan -> apply, with real move detection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["mmap", "rayon"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
hostname = "0.4"

[profile.release]
lto = true
