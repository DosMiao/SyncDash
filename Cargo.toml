[workspace]
members = [".", "src-tauri"]

[package]
name = "syncdash"
version = "0.9.0"
edition = "2021"
description = "Table-driven multi-node file sync: scan -> compare -> plan -> apply, with real move detection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["mmap", "rayon"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
hostname = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
rayon = "1"
tar = "0.4"
fastcdc = "3"

# statvfs锛堢鐩樼┖闂撮妫€锛夈€俉indows 渚ц蛋 kernel32 鐨?GetDiskFreeSpaceExW锛屾棤闇€棰濆 crate銆?[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
