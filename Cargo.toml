[workspace]
members = [".", "Dev/src-tauri"]

[package]
name = "syncdash"
version = "0.9.0"
edition = "2021"
rust-version = "1.89"
description = "Table-driven multi-node file sync: scan -> compare -> plan -> apply, with real move detection"

[lib]
path = "Dev/src/lib.rs"

[[bin]]
name = "syncdash"
path = "Dev/src/main.rs"

[features]
export-types = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No "mmap" feature, deliberately: it is what makes `update_mmap*` compile, and reading a mapped
# page whose file was truncated or whose volume vanished raises SIGBUS — a signal no `?` can catch.
# Dropping the feature turns "don't map user files" from a convention into a compile error.
# "rayon" only exists to enable `update_mmap_rayon`/`update_rayon`; the crate's own `rayon`
# dependency below is unaffected. See the crate header in Dev/src/lib.rs.
blake3 = "1"
getrandom = "0.3"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
cap-primitives = "4.0.2"
cap-fs-ext = { version = "4.0.2", default-features = false }
hostname = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
rayon = "1"
tar = "0.4"
fastcdc = "3"
# Rust → TypeScript wire contracts. `export-types` keeps generation out of normal tests.
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

# OS credential store (Windows Credential Manager / macOS Keychain). Job files carry zero
# secrets by design; the phrase derives the keyring account and this is the only place
# passwords live at rest.
keyring = "4"
# No-echo password prompt for `syncdash cred set` (secrets never appear in argv or on screen)
rpassword = "7"
# SFTP backend: pure-Rust SSH (no OpenSSL, no perl — this machine's MSVC 2019 cannot
# build aws-lc, hence the ring backend). Reads OpenSSH-format keys natively, which the
# libssh2/WinCNG route could not. tokio stays private to the backend: the trait is sync.
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "io-util", "time"] }
suppaftp = { version = "10", features = ["rustls-ring"] }
smb2 = "0.13.1"
rustls-native-certs = "0.8.4"
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }

# statvfs (disk-space preflight). Windows goes through kernel32's GetDiskFreeSpaceExW, no extra crate needed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDate", "CFString", "CFUUID"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "dispatch2", "FSEvents", "libc"] }

# Integration tests under tests/ link the crate but resolve their own imports, so the
# crates they touch directly have to be named again here.
[dev-dependencies]
tar = "0.4"
blake3 = "1"
serde_json = "1"

[profile.release]
lto = true
