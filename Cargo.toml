[workspace]
members = [".", "src-tauri"]

[package]
name = "syncdash"
version = "0.9.0"
edition = "2021"
description = "Table-driven multi-node file sync: scan -> compare -> plan -> apply, with real move detection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["mmap", "rayon"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
hostname = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
rayon = "1"
tar = "0.4"
fastcdc = "3"
# Rust → TypeScript 类型生成。前端此前手抄了 17 个 Rust 类型共 26 份镜像
# （`Job` 一个就有 4 份：Rust struct / JobFull / ED_FIELDS / defaultJob()），
# 无 codegen、无校验，已经漂移出真 bug（`OpDto` 漏了 `link`，symlink 操作
# 会静默退化成内容复制）。导出目录见 `.cargo/config.toml`。
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

# statvfs（磁盘空间预检）。Windows 走 kernel32 的 GetDiskFreeSpaceExW，无需额外 crate。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
