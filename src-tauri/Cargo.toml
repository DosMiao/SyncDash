[package]
name = "syncdash-desktop"
version = "0.3.0"
edition = "2021"
description = "SyncDash desktop shell (Tauri v2) over the syncdash core library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syncdash = { path = ".." }
