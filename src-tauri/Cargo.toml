[package]
name = "syncdash-desktop"
version = "0.9.0"
edition = "2021"
description = "SyncDash desktop shell (Tauri v2) over the syncdash core library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# custom-protocol 是"加载内置 dist"的开关：没有它，release 构建也会去连
# devUrl(localhost:5173) —— 表现为整窗 ERR_CONNECTION_REFUSED 空白页。
# `tauri build` 会自动传；我们用裸 cargo build，必须放进 default。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# 原生目录/文件选择器。JS 侧不装 @tauri-apps/plugin-dialog——那个包只是
# `invoke('plugin:dialog|open', {options})` 的薄包装，直接用现成的 api.invoke 调即可。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syncdash = { path = ".." }
