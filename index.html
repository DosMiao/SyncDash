<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncDash</title>
  <link rel="stylesheet" href="/typescript/styles.css" />
</head>
<body>
  <div id="dragstrip" data-tauri-drag-region></div>
  <div id="app">
    <aside id="sidebar">
      <div class="brand" data-tauri-drag-region>Sync<span>Dash</span></div>
      <div id="joblist"></div>
      <button id="btn-newjob" class="btn newjob">＋ 新任务</button>
      <div id="sidefoot">
        <span id="appver" class="dim"></span>
        <span id="jobsdir" class="dim"></span>
      </div>
    </aside>
    <main id="main">
      <header id="toolbar">
        <button id="btn-compare" class="btn primary" disabled>⟳ Compare</button>
        <button id="btn-sync" class="btn accent" disabled>▶ Synchronize</button>
        <button id="btn-log" class="btn" title="运行日志">🗒</button>
        <button id="btn-watch" class="btn" title="值守：按任务的 watch 间隔定时比对" disabled>⏱ Watch</button>
        <span id="stats" class="stats"></span>
        <span id="spin" class="spinner hidden"></span>
      </header>
      <div id="pathline" class="pathline mono dim"></div>
      <div id="filterbar" class="hidden">
        <input id="search" class="mono" type="text" placeholder="搜索 path / from / reason   (Ctrl+F)" />
        <div id="chips"></div>
      </div>
      <div id="reviewrow">
      <aside id="overview" class="collapsed">
        <button id="ov-toggle" title="Overview 聚合（展开/收起）">☰</button>
        <div id="ov-body">
          <div class="ov-head"><span>Overview</span><span id="ov-clear" title="清除过滤">✕</span></div>
          <div id="ov-list"></div>
        </div>
      </aside>
      <div id="tablewrap">
        <div id="empty" class="empty">← 选择任务，然后 Compare（Ctrl+R）</div>
        <table id="plantable" class="hidden">
          <thead>
            <tr>
              <th class="c-chk"><input type="checkbox" id="chk-head" checked title="全选/全不选（当前视图）" /></th>
              <th class="c-act">action <span class="dim thin">（点徽章翻方向）</span></th>
              <th>path</th>
              <th>from</th>
              <th class="c-size">size</th>
              <th>reason</th>
            </tr>
          </thead>
          <tbody id="planbody"></tbody>
        </table>
      </div>
      </div>
      <footer id="status">就绪</footer>
    </main>
  </div>
  <div id="editmodal" class="hidden">
    <div class="sheet edsheet">
      <h3 id="ed-title">编辑任务</h3>
      <div id="ed-form"></div>
      <div class="btnrow">
        <button id="ed-delete" class="btn danger hidden">删除任务</button>
        <span class="spacer"></span>
        <button id="ed-cancel" class="btn">取消 (Esc)</button>
        <button id="ed-save" class="btn accent">保存</button>
      </div>
    </div>
  </div>
  <div id="logmodal" class="hidden">
    <div class="sheet logsheet">
      <h3>运行日志 <span id="log-scope" class="dim thin"></span></h3>
      <div id="log-list"></div>
      <pre id="log-detail" class="hidden mono"></pre>
      <div class="btnrow">
        <button id="log-back" class="btn hidden">← 返回列表</button>
        <button id="log-close" class="btn">关闭 (Esc)</button>
      </div>
    </div>
  </div>
  <div id="modal" class="hidden">
    <div class="sheet">
      <h3>确认同步</h3>
      <div id="modal-body"></div>
      <div class="btnrow">
        <button id="modal-cancel" class="btn">取消 (Esc)</button>
        <button id="modal-ok" class="btn accent">执行 (Enter)</button>
      </div>
    </div>
  </div>
  <script type="module" src="/typescript/main.ts"></script>
</body>
</html>
