<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncDash — 运行</title>
  <!-- 全部样式在 styles.css：Tauri 会给 CSP 注入自身内联脚本的 nonce，
       浏览器随即无视 'unsafe-inline'——内联 <style>/style="" 会被整块拦掉（白屏教训） -->
  <script type="module" crossorigin src="/assets/progress-DIQlue77.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/window-0rqARpDD.js">
  <link rel="stylesheet" crossorigin href="/assets/window-AUYOseH3.css">
</head>
<body>
  <div id="pwin">
    <div id="phead">
      <span id="pjob">SyncDash</span>
      <span id="pphase">等待运行…</span>
      <span id="ppct">—</span>
    </div>

    <div id="stagerows"></div>

    <div id="graphs">
      <div class="gwrap">
        <span class="gcap">数据（累计字节）</span>
        <span class="grate" id="rate-bytes"></span>
        <canvas id="cv-bytes"></canvas>
      </div>
      <div class="gwrap">
        <span class="gcap">条目（累计项数）</span>
        <span class="grate" id="rate-items"></span>
        <canvas id="cv-items"></canvas>
      </div>
      <div id="readouts">
        <div class="rh"></div><div class="rh">已处理</div><div class="rh">剩余</div>
        <div class="rh">条目</div><div id="ro-items-done">—</div><div id="ro-items-left">—</div>
        <div class="rh">字节</div><div id="ro-bytes-done">—</div><div id="ro-bytes-left">—</div>
        <div class="rh">时间</div><div id="ro-elapsed">—</div><div id="ro-eta">—</div>
      </div>
      <div id="curfile"></div>
    </div>

    <div id="errsec">
      <div id="errhead">
        <span>⚠</span>
        <span class="cnt-err" id="cnt-err"></span>
        <span class="cnt-warn" id="cnt-warn"></span>
        <span class="dim errtip">点击展开</span>
      </div>
      <div id="errlist"></div>
    </div>

    <div id="countdown">
      <span id="cdtext"></span>
      <div id="cdbar"><div id="cdfill"></div></div>
      <button class="btn" id="cd-cancel">取消</button>
    </div>

    <div id="controls">
      <button class="btn" id="btn-pause" disabled>⏸ 暂停</button>
      <button class="btn" id="btn-stop" disabled>■ 停止</button>
      <label class="dim chkline">
        <input type="checkbox" id="chk-autoclose" /> 完成后自动关窗
      </label>
      <span id="wfin">
        完成后
        <select id="sel-wfin">
          <option value="none">无动作</option>
          <option value="sleep">睡眠</option>
          <option value="shutdown">关机</option>
        </select>
      </span>
    </div>
  </div>
</body>
</html>
